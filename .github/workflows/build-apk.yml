name: Build Fixeaze Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Project Structure
        run: |
          mkdir -p www
          if [ ! -f "www/index.html" ]; then
            echo "<h1>Fixeaze App</h1>" > www/index.html
          fi
          if [ ! -f "package.json" ]; then
            echo '{"name": "fixeaze-app", "version": "1.0.0", "private": true, "dependencies": {"@capacitor/android": "^6.0.0", "@capacitor/cli": "^6.0.0", "@capacitor/core": "^6.0.0"}}' > package.json
          fi

      - name: Install & Setup Capacitor
        run: |
          npm install --legacy-peer-deps
          npx cap init "Fixeaze" "com.fixeaze.app" --web-dir=www --yes
          npx cap add android
          npx cap sync android

      - name: Inject Permissions into AndroidManifest.xml
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/<\/manifest>/i <uses-permission android:name="android.permission.CAMERA" />\n<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n<uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n<uses-feature android:name="android.hardware.camera" android:required="false" />' "$MANIFEST"
          fi

      - name: Build Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fixeaze-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
