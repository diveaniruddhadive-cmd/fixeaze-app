name: Build Fixeaze Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Capacitor dependencies
        run: npm install

      - name: Add Android Platform & Sync
        run: |
          npx cap add android
          npx cap sync android

      - name: Inject Camera & Location Permissions into AndroidManifest.xml
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<\/manifest>/i <uses-permission android:name="android.permission.CAMERA" />\n<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n<uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n<uses-feature android:name="android.hardware.camera" android:required="false" />' "$MANIFEST"

      - name: Build Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Ready-to-Install Fixeaze APK
        uses: actions/upload-artifact@v4
        with:
          name: Fixeaze-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
